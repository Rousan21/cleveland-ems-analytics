name: Preview EMS dashboard on Cloudflare Pages
on:
  pull_request:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/preview-cloudflare-pages.yml'

permissions:
  contents: read

concurrency:
  group: ems-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Only trusted same-repository branches can access deployment/database secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r webapp/requirements.txt
      - name: Bootstrap verified Cleveland source records (safe additive table)
        env:
          EMS_DATABASE_URL: ${{ secrets.EMS_DATABASE_URL }}
        run: python webapp/cleveland_pipeline.py bootstrap --days 400
      - name: Build precomputed privacy-safe snapshots
        env:
          EMS_DATABASE_URL: ${{ secrets.EMS_DATABASE_URL }}
        run: python webapp/export_static.py --output site_build
      - name: Publish to Cloudflare preview branch (not production)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site_build --project-name=cleveland-ems-explorer --branch=${{ github.head_ref }}

      - name: Install browser audit support
        if: github.head_ref == 'dashboard-v6-real-cleveland-data'
        run: python -m pip install playwright
      - name: Inspect real preview map at desktop/mobile sizes
        if: github.head_ref == 'dashboard-v6-real-cleveland-data'
        run: python webapp/browser_map_audit.py --url "https://dashboard-v6-real-cleveland.cleveland-ems-explorer.pages.dev" --output map_browser_report
      - name: Save map preview screenshots
        if: always() && github.head_ref == 'dashboard-v6-real-cleveland-data'
        uses: actions/upload-artifact@v4
        with:
          name: cleveland-map-preview
          path: map_browser_report/
          retention-days: 3
          if-no-files-found: warn

