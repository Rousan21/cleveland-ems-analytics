name: Preview EMS dashboard on Cloudflare Pages
on:
  pull_request:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/preview-cloudflare-pages.yml'

permissions:
  # Allow the verified same-repository PR workflow to update checked-in
  # screenshots after Chrome completes its assertions.
  contents: write

concurrency:
  group: ems-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Only trusted same-repository branches can access deployment/database secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out PR head, not GitHub's synthetic pull-request merge ref,
          # so screenshot commits update the feature branch without merging.
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r webapp/requirements.txt
      - name: Bootstrap verified Cleveland source records (safe additive table)
        env:
          EMS_DATABASE_URL: ${{ secrets.EMS_DATABASE_URL }}
        run: python webapp/cleveland_pipeline.py bootstrap --days 400
      - name: Build precomputed privacy-safe snapshots
        env:
          EMS_DATABASE_URL: ${{ secrets.EMS_DATABASE_URL }}
        run: python webapp/export_static.py --output site_build
      - name: Publish to Cloudflare preview branch (not production)
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site_build --project-name=cleveland-ems-explorer --branch=${{ github.head_ref }}

      - name: Install browser audit support
        if: github.head_ref == 'dashboard-v6-real-cleveland-data'
        run: python -m pip install playwright
      - name: Inspect real preview map at desktop/mobile sizes
        if: github.head_ref == 'dashboard-v6-real-cleveland-data'
        env:
          # Use immutable deployment URL to avoid stale branch-alias caching.
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url || 'https://dashboard-v6-real-cleveland.cleveland-ems-explorer.pages.dev' }}
        run: python webapp/browser_map_audit.py --url "$PREVIEW_URL" --output map_browser_report
      - name: Refresh README screenshots from tested Cloudflare preview
        if: success() && github.head_ref == 'dashboard-v6-real-cleveland-data'
        run: |
          # Real, trusted Chrome screenshots: no fabricated maps or numbers.
          test -s map_browser_report/desktop.png
          test -s map_browser_report/desktop-incident-types.png
          mkdir -p assets
          cp map_browser_report/desktop.png assets/dashboard.png
          cp map_browser_report/desktop-incident-types.png assets/incident-types.png
          cp map_browser_report/desktop-overview.png assets/dashboard-overview.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.png assets/incident-types.png assets/dashboard-overview.png
          if git diff --cached --quiet; then
            echo "README screenshots already current"
          else
            git commit -m "docs: refresh screenshots from verified Cleveland EMS preview"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Save map preview screenshots
        if: always() && github.head_ref == 'dashboard-v6-real-cleveland-data'
        uses: actions/upload-artifact@v4
        with:
          name: cleveland-map-preview
          path: map_browser_report/
          retention-days: 3
          if-no-files-found: warn

