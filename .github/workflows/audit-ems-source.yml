name: Audit EMS source data
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many recent days to audit? (1–365)'
        type: choice
        options: ['7', '30', '90']
        default: '30'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit source (no database credentials)
        env:
          AUDIT_DAYS: ${{ inputs.days }}
        run: python audit_source.py --days "$AUDIT_DAYS"
      - uses: actions/upload-artifact@v4
        with:
          name: ems-source-aggregate-audit
          path: webapp/source_audit_summary.json
          retention-days: 14
