name: Daily EMS data update
on:
  schedule:
    - cron: '37 13 * * *'  # Daily, UTC; not guaranteed to run precisely on time
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Backfill up to 2,000 days of Cleveland city records? (large)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ems-database-import
  cancel-in-progress: false
jobs:
  update-database:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: webapp
    env:
      EMS_DATABASE_URL: ${{ secrets.EMS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - name: Check database credentials
        id: check
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -z "$EMS_DATABASE_URL" ]; then
            if [ "$TRIGGER" = "schedule" ]; then
              echo '::warning::EMS_DATABASE_URL not configured; daily import skipped.'
              echo 'skip=true' >> "$GITHUB_OUTPUT"
            else
              echo '::error::Set repository secret EMS_DATABASE_URL to a Neon PostgreSQL connection URL.'
              exit 1
            fi
          fi
      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: python -m pip install -r requirements.txt
      - name: Import verified Cleveland, Ohio EMS data
        if: steps.check.outputs.skip != 'true'
        env:
          FULL_HISTORY: ${{ inputs.full_history }}
        run: |
          # Import ONLY City of Cleveland CAD EMS records; the prior Virginia
          # Beach importer remains archived for historical code comparison.
          if [ "$FULL_HISTORY" = "true" ]; then
            python cleveland_pipeline.py sync --days 2000
          else
            python cleveland_pipeline.py bootstrap --days 400
            python cleveland_pipeline.py sync --days 45
          fi
      - name: Check Cloudflare Pages configuration
        id: pages
        if: steps.check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Cloudflare Pages secrets not configured; snapshot deployment skipped.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Export updated dashboard snapshots
        if: steps.pages.outputs.ready == 'true'
        run: python export_static.py --output ../site_build
      - name: Publish snapshots to Cloudflare Pages
        if: steps.pages.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site_build --project-name=cleveland-ems-explorer --branch=main
