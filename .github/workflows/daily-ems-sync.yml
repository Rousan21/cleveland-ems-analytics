name: Daily EMS data update
on:
  schedule:
    - cron: '37 13 * * *'  # Daily, UTC; not guaranteed to run precisely on time
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Backfill the entire city-published history? (may be large)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ems-database-import
  cancel-in-progress: false
jobs:
  update-database:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: webapp
    env:
      EMS_DATABASE_URL: ${{ secrets.EMS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - name: Check database credentials
        id: check
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -z "$EMS_DATABASE_URL" ]; then
            if [ "$TRIGGER" = "schedule" ]; then
              echo '::warning::EMS_DATABASE_URL not configured; daily import skipped.'
              echo 'skip=true' >> "$GITHUB_OUTPUT"
            else
              echo '::error::Set repository secret EMS_DATABASE_URL to a Neon PostgreSQL connection URL.'
              exit 1
            fi
          fi
      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: python -m pip install -r requirements.txt
      - name: Import public EMS data
        if: steps.check.outputs.skip != 'true'
        env:
          FULL_HISTORY: ${{ inputs.full_history }}
        run: |
          if [ "$FULL_HISTORY" = "true" ]; then
            python ingest.py --all
          else
            python ingest.py --days 30
          fi
