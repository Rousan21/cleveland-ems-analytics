# Optional GitHub Actions workflow: move to .github/workflows/ems-v2-tests.yml
# when the webapp folder is committed to the original repository.
name: EMS v2 checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
